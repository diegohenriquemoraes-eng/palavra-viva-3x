name: Realinhar descrições

# Reescreve título/descrição/tags dos vídeos JÁ publicados de um canal para o
# padrão atual de publicador/config.json + conteudo/temas.json — é como uma
# mudança de oferta, de SEO ou do bloco de playlist chega ao acervo.
#
# Roda de duas formas:
#
# - MANUAL (workflow_dispatch), para um canal específico e com limite à mão.
# - AGENDADO, todo dia às 07:10 UTC, nos canais ativos, com teto de 10 vídeos
#   por canal. O script pula o que já está no padrão (custo 1 unidade por
#   leitura), então em dia sem mudança nenhuma a rodada gasta ~40 unidades e
#   não atualiza nada. Quando o padrão muda, o acervo se realinha sozinho em
#   rodadas de 10/dia, sem ninguém precisar lembrar de clicar.
#
# Por que 07:10 UTC e por que o teto: a cota vira às 07:00 UTC (meia-noite no
# Pacífico) e a publicação do dia do ES passou a comer ~7.660 das 10.000
# unidades (2 longos + 2 Shorts, desde 25/08). 10 vídeos x 51 = 510 deixam
# ~1.800 de margem, que cobre um retry de upload; com 19 a margem caía para
# 1.371 e um único reenvio de longo estouraria a cota — deixando o canal sem
# publicar, que é o dano que este projeto já pagou antes.
#
# O ES tem 38 longos, então o acervo inteiro leva 4 dias. Depois disso a
# rodada diária custa só as leituras (~40 unidades), porque o script pula o
# que já está no padrão.
on:
  schedule:
    - cron: "10 7 * * *"
  workflow_dispatch:
    inputs:
      canal:
        description: "Canal a realinhar (es/en/pt)"
        required: true
        default: "pt"
      dry_run:
        description: "Só listar o que mudaria"
        type: boolean
        default: true
      limite:
        description: "Máx. de vídeos atualizados nesta rodada (0 = sem teto)"
        required: false
        default: "0"

concurrency:
  group: publicar-3x
  cancel-in-progress: false

jobs:
  realinhar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restaurar credenciais
        env:
          ES_SECRET: ${{ secrets.YT_CLIENT_SECRET_ES }}
          ES_TOKEN: ${{ secrets.YT_TOKEN_ES }}
          EN_SECRET: ${{ secrets.YT_CLIENT_SECRET_EN }}
          EN_TOKEN: ${{ secrets.YT_TOKEN_EN }}
          PT_SECRET: ${{ secrets.YT_CLIENT_SECRET_PT }}
          PT_TOKEN: ${{ secrets.YT_TOKEN_PT }}
        run: |
          # No agendado precisamos dos canais ativos; no manual, só o pedido.
          alvos="${{ inputs.canal }}"
          [ -z "$alvos" ] && alvos="es pt"
          for lang in $alvos; do
            secret_var="$(echo $lang | tr a-z A-Z)_SECRET"
            token_var="$(echo $lang | tr a-z A-Z)_TOKEN"
            secret="${!secret_var}"
            token="${!token_var}"
            if [ -z "$secret" ] || [ -z "$token" ]; then
              echo "canal $lang sem secrets"; continue
            fi
            mkdir -p "credenciais/$lang"
            printf '%s' "$secret" > "credenciais/$lang/client_secret.json"
            printf '%s' "$token" > "credenciais/$lang/token.json"
            chmod 600 credenciais/$lang/*
          done

      - run: git pull --rebase --autostash origin main || true

      - name: Realinhar
        run: |
          if [ -z "${{ inputs.canal }}" ]; then
            for lang in es pt; do
              echo "=== agendado: $lang (teto 10) ==="
              python produzir/realinhar_publicados.py --canal $lang --limite 10
            done
          else
            args="--canal ${{ inputs.canal }} --limite ${{ inputs.limite }}"
            [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
            echo "args:$args"
            python produzir/realinhar_publicados.py $args
          fi

      - name: Guardar estado
        if: always()
        run: |
          rm -rf credenciais
          if [ -n "$(git status --porcelain publicador/state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publicador/state.json
            git commit -m "Realinha descrições (auto)"
            git pull --rebase --autostash origin main
            git push
          else
            echo "Nada a guardar."
          fi
