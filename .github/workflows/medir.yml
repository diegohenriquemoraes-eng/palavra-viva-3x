name: Medir desempenho

# Segunda de manhã (09:00 UTC = 06:00 em São Paulo), antes de qualquer decisão
# da semana. Roda na nuvem com os secrets que já existem: não depende do PC do
# Diego (que nem alcança googleapis.com) nem de app aberto.
#
# O que importa aqui não é a foto de agora — é a SÉRIE em
# conteudo/desempenho_historico.json, sempre da mesma coorte de idade (Shorts
# com 2 a 7 dias). É ela que diz se uma mudança de formato funcionou.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: medir-desempenho
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restaurar credenciais dos canais configurados
        env:
          ES_SECRET: ${{ secrets.YT_CLIENT_SECRET_ES }}
          ES_TOKEN: ${{ secrets.YT_TOKEN_ES }}
          EN_SECRET: ${{ secrets.YT_CLIENT_SECRET_EN }}
          EN_TOKEN: ${{ secrets.YT_TOKEN_EN }}
          PT_SECRET: ${{ secrets.YT_CLIENT_SECRET_PT }}
          PT_TOKEN: ${{ secrets.YT_TOKEN_PT }}
        run: |
          for lang in es en pt; do
            secret_var="$(echo $lang | tr a-z A-Z)_SECRET"
            token_var="$(echo $lang | tr a-z A-Z)_TOKEN"
            secret="${!secret_var}"
            token="${!token_var}"
            if [ -n "$secret" ] && [ -n "$token" ]; then
              mkdir -p "credenciais/$lang"
              printf '%s' "$secret" > "credenciais/$lang/client_secret.json"
              printf '%s' "$token" > "credenciais/$lang/token.json"
              chmod 600 credenciais/$lang/*
            fi
          done

      - name: Medir
        run: |
          git pull --rebase --autostash origin main || true
          python produzir/medir_desempenho.py | tee medicao.txt

      - name: Publicar o resumo na página do run
        if: always()
        run: |
          {
            echo '## Desempenho — coorte comparável'
            echo '```'
            # só a parte que decide; a listagem vídeo a vídeo fica no artefato
            sed -n '/COORTE COMPAR/,$p' medicao.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar a série
        if: always()
        run: |
          rm -rf credenciais medicao.txt
          if [ -n "$(git status --porcelain conteudo/desempenho.json conteudo/desempenho_historico.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add conteudo/desempenho.json conteudo/desempenho_historico.json
            git commit -m "Mede desempenho (auto)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep 10
            done
          else
            echo "nada mudou"
          fi
